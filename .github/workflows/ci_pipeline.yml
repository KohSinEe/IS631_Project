name: CI - CodeQL and Code Quality Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
          
  code-quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint mypy
          
      - name: Run Black (Code Formatting Check)
        run: |
          black --check --diff app frontend
        continue-on-error: false
        
      - name: Run Flake8 (Linting)
        run: |
          flake8 app frontend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app frontend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: false
        
      - name: Run Pylint (Code Analysis)
        run: |
          find app frontend -name "*.py" -print0 | xargs -0 pylint --exit-zero
        continue-on-error: true
        
      - name: Run MyPy (Type Checking)
        run: |
          mypy app frontend --ignore-missing-imports
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "✅ Code quality checks completed!"
          echo "Review the logs above for any issues found."