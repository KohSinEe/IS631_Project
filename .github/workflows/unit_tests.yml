name: Unit Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest --cov=app/api --cov-report=xml --cov-report=term
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Upload coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
